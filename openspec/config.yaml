schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Todas las documentaciones, especificaciones, descripciones y comentarios deben generarse estrictamente en idioma español.
  El dominio es una plataforma de Gestión de Órdenes de Servicio (OS) y entidades principales.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - "Superpowers TDD: Para cada tarea en tasks.md, aplicar ciclo Red-Green-Refactor escribiendo primero pruebas que fallen (superpowers-tdd)."
      - "Superpowers Debugging: En caso de errores o fallos en pruebas, diagnosticar la causa raíz antes de modificar código (superpowers-debugging)."
      - "Superpowers Code Review: Antes de marcar una tarea como completada, validar conformidad con la especificación delta y calidad de arquitectura (superpowers-code-review)."
  archive:
    guidance:
      - "Verificar que toda la suite de pruebas automatizadas (.NET y Angular) pase exitosamente antes de archivar."

