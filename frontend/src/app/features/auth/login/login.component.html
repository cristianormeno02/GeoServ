<div class="login-wrapper">
  <!-- Left/Top Section: Branding Graphic (Abstract/Geometric) -->
  <div class="branding-section">
    <!-- App Logo (GeoServ) in the top left -->
    <div class="app-logo-container">
      <img [src]="appLogo" alt="Logo de {{appName}}" class="app-logo" (error)="appLogo = ''" *ngIf="appLogo">
      <span *ngIf="!appLogo" class="app-name-fallback">{{ appName }}</span>
    </div>

    <div class="branding-overlay">
      <!-- Muestra dinámica del logo de la empresa -->
      <div class="tenant-logo-container">
        <!-- SVG o img tag; aquí usamos un placeholder textual si falla el logo, pero preparamos el src -->
        <img [src]="tenantLogo" alt="Logo de {{tenantName}}" class="tenant-logo" (error)="tenantLogo = ''" *ngIf="tenantLogo">
        <h1 class="tenant-name" *ngIf="!tenantLogo">{{ tenantName }}</h1>
      </div>
      <p class="branding-subtitle">Gestión inteligente de operaciones y finanzas mineras.</p>
    </div>
  </div>

  <!-- Right/Bottom Section: Login Form -->
  <div class="form-section">
    <div class="form-container">
      <div class="form-header">
        <h2>Iniciar Sesión</h2>
        <p>Ingresa a tu cuenta de {{ tenantName }}</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo Electrónico</mat-label>
          <input matInput type="email" formControlName="email" placeholder="ejemplo@correo.com">
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">El correo es requerido.</mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Ingresa un correo válido.</mat-error>
        </mat-form-field>

        <div class="password-field-container">
          <mat-form-field appearance="outline" class="full-width password-input">
            <mat-label>Contraseña</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
            <mat-icon matPrefix>lock</mat-icon>
            <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button" [attr.aria-label]="'Ocultar contraseña'" [attr.aria-pressed]="hidePassword">
              <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">La contraseña es requerida.</mat-error>
          </mat-form-field>
          <div class="forgot-password-link">
            <a routerLink="/recover-password">¿Olvidaste tu contraseña?</a>
          </div>
        </div>

        <div class="form-actions">
          <button mat-flat-button class="full-width login-button" type="submit" [disabled]="loginForm.invalid">
            Ingresar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
