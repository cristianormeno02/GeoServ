<h2 mat-dialog-title>{{ data ? 'Editar' : 'Nuevo' }} Insumo</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    
    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Fecha de Compra</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="purchaseDate">
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
      
      <mat-form-field appearance="outline">
        <mat-label>Proveedor (Opcional)</mat-label>
        <mat-select formControlName="providerId">
          <mat-option [value]="null">Ninguno</mat-option>
          <mat-option *ngFor="let prov of providers" [value]="prov.id">{{prov.name}}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Tipo de Insumo</mat-label>
        <mat-select formControlName="typeId">
          <mat-option *ngFor="let t of types" [value]="t.id">{{t.name}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Clase de Insumo</mat-label>
        <mat-select formControlName="consumableClassId">
          <mat-option *ngFor="let c of filteredClasses" [value]="c.id">{{c.name}}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descripción</mat-label>
      <input matInput formControlName="description">
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline" class="small-field">
        <mat-label>Cantidad</mat-label>
        <input matInput type="number" formControlName="quantity" [readonly]="data">
      </mat-form-field>

      <mat-form-field appearance="outline" class="small-field">
        <mat-label>Unidad</mat-label>
        <mat-select formControlName="unitId">
          <mat-option *ngFor="let u of units" [value]="u.id">{{u.name}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="small-field">
        <mat-label>Costo Unitario</mat-label>
        <span matTextPrefix>$&nbsp;</span>
        <input matInput type="text" formControlName="unitCost" mask="separator.2" thousandSeparator="." decimalMarker="," class="text-right">
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Costo Total</mat-label>
      <span matTextPrefix>$&nbsp;</span>
      <input matInput type="text" formControlName="totalCost" mask="separator.2" thousandSeparator="." decimalMarker="," class="text-right" readonly>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Observaciones</mat-label>
      <textarea matInput formControlName="observation"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="save()">Guardar</button>
</mat-dialog-actions>
