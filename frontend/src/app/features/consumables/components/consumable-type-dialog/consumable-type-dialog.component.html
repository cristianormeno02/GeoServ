<h2 mat-dialog-title>{{ data ? 'Editar' : 'Nuevo' }} Tipo de Insumo</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form" style="margin-top: 10px;">
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="save()">Guardar</button>
</mat-dialog-actions>
