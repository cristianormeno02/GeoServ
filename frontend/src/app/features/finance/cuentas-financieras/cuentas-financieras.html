<div class="page-container">
  <div class="page-header">
    <h1>Cuentas Bancarias y Cajas</h1>
    <button mat-raised-button color="primary">
      <mat-icon>add</mat-icon>
      Nueva Cuenta
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="accounts" class="mat-elevation-z2" style="width: 100%;">
        
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Nombre </th>
          <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>

        <ng-container matColumnDef="accountNumber">
          <th mat-header-cell *matHeaderCellDef> Número </th>
          <td mat-cell *matCellDef="let element"> {{element.accountNumber}} </td>
        </ng-container>

        <ng-container matColumnDef="accountType">
          <th mat-header-cell *matHeaderCellDef> Tipo </th>
          <td mat-cell *matCellDef="let element"> {{element.accountType}} </td>
        </ng-container>

        <ng-container matColumnDef="currencyName">
          <th mat-header-cell *matHeaderCellDef> Moneda </th>
          <td mat-cell *matCellDef="let element"> {{element.currencyName}} </td>
        </ng-container>

        <ng-container matColumnDef="isActive">
          <th mat-header-cell *matHeaderCellDef> Estado </th>
          <td mat-cell *matCellDef="let element"> 
            <span [class.active-badge]="element.isActive" [class.inactive-badge]="!element.isActive">
              {{element.isActive ? 'Activa' : 'Inactiva'}}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Acciones </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <div *ngIf="accounts.length === 0" class="empty-state">
        <p>No hay cuentas financieras registradas.</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
