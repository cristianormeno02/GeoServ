<div class="page-container">
  <div class="page-header">
    <h1>Activos</h1>
    <button mat-raised-button color="primary" (click)="openAddDialog()">
      <mat-icon>add</mat-icon>
      Nuevo Activo
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="assets" class="mat-elevation-z2" style="width: 100%;">
        
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Nombre </th>
          <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef> Descripción </th>
          <td mat-cell *matCellDef="let element"> {{element.description}} </td>
        </ng-container>

        <ng-container matColumnDef="purchasePrice">
          <th mat-header-cell *matHeaderCellDef> Precio Compra </th>
          <td mat-cell *matCellDef="let element"> {{element.purchasePrice | currency}} </td>
        </ng-container>

        <ng-container matColumnDef="purchaseDate">
          <th mat-header-cell *matHeaderCellDef> Fecha Compra </th>
          <td mat-cell *matCellDef="let element"> {{element.purchaseDate | date:'shortDate'}} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Acciones </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="openEditDialog(element)" title="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteAsset(element)" title="Eliminar">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <div *ngIf="assets.length === 0" class="empty-state">
        <p>No hay activos registrados.</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
