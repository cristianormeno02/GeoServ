<div class="page-container">
  <div class="page-header">
    <h1>Cartera de Cheques</h1>
    <button mat-raised-button color="primary" (click)="openAddDialog()">
      <mat-icon>add</mat-icon>
      Nuevo Cheque
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="checks" class="mat-elevation-z2" style="width: 100%;">
        
        <ng-container matColumnDef="checkNumber">
          <th mat-header-cell *matHeaderCellDef> Número </th>
          <td mat-cell *matCellDef="let element"> {{element.checkNumber}} </td>
        </ng-container>

        <ng-container matColumnDef="bankName">
          <th mat-header-cell *matHeaderCellDef> Banco </th>
          <td mat-cell *matCellDef="let element"> {{element.bankName}} </td>
        </ng-container>

        <ng-container matColumnDef="issuerName">
          <th mat-header-cell *matHeaderCellDef> Emisor </th>
          <td mat-cell *matCellDef="let element"> {{element.issuerName}} </td>
        </ng-container>

        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef> Monto </th>
          <td mat-cell *matCellDef="let element"> {{element.amount | currency}} </td>
        </ng-container>

        <ng-container matColumnDef="dueDate">
          <th mat-header-cell *matHeaderCellDef> Vencimiento </th>
          <td mat-cell *matCellDef="let element"> {{element.dueDate | date:'shortDate'}} </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Estado </th>
          <td mat-cell *matCellDef="let element">
            <span class="status-badge status-{{element.status}}">
              {{getStatusName(element.status)}}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Acciones </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="openEditDialog(element)" title="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteCheck(element)" title="Eliminar">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <div *ngIf="checks.length === 0" class="empty-state">
        <p>No hay cheques registrados en cartera.</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
